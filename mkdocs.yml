site_name: StatMod Wiki
site_description: Wiki кафедры статистического моделирования
# site_url: https://statmod.github.io/wiki/
site_url: https://wiki.statmod.ru
repo_url: https://github.com/statmod/wiki
repo_name: statmod/wiki

# For a custom domain later (e.g. wiki.statmod.ru), change site_url only.
# Keep all documentation links relative so both base paths work.

theme:
  name: material
  language: ru
  favicon: favicon.ico
  logo: statmod_logo.gif
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang:
        - ru
        - en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social: []

# Known missing media from the original DokuWiki dump (Cyrillic filenames, etc.)
# validation:
#  omitted_files: info
#  absolute_links: info
#  unrecognized_links: info

